<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip-8 Emulator</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">

    <link rel="stylesheet" href="chip8.css">
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .material-symbols-rounded {
          font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24
        }
    </style> -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div id="emulator-window" class="window fit-content file-drop-zone" ondrop="dropHandler(event);"><!-- ondragover="dragOverHandler(event);" -->

        <div class="control-bar">
            <div id="controls">
                <!-- ↻↺↦↳⇒⇥⇢⇻▶▷ -->
                <button id="replay" class="material-icons-round md-light md-24" title="Replay" onclick="replay()">replay</button>
                <button id="play-pause" class="material-icons-round md-light md-24" title="Play/Pause" onclick="playPause()">play_arrow</button>
                <button id="step" class="material-icons-round md-light md-24" title="Step Instruction" onclick="step()">skip_next</button>
                <button id="step-frame" class="material-icons-round md-light md-24" title="Step Frame" onclick="stepFrame()">keyboard_tab</button>
            </div>
            <div id="info">
                <div title="Frames Per Second">FPS: <div id="fps">00.0</div>
                </div>
                <div title="Instructions Per Second">IPS: <div id="ips">000.0</div>
                </div>
            </div>
        </div>

        <div id="screen-container">
            <canvas id="screen" width="320" height="160" style="border:1px solid #000000;"></canvas>
        </div>

        <div id="keyboard-container">
            <table id="keyboard">
                <tr>
                    <td> <button key="1">1</button> </td>
                    <td> <button key="2">2</button> </td>
                    <td> <button key="3">3</button> </td>
                    <td> <button key="c">C</button> </td>
                </tr>
                <tr>
                    <td> <button key="4">4</button> </td>
                    <td> <button key="5">5</button> </td>
                    <td> <button key="6">6</button> </td>
                    <td> <button key="d">D</button> </td>
                </tr>
                <tr>
                    <td> <button key="7">7</button> </td>
                    <td> <button key="8">8</button> </td>
                    <td> <button key="9">9</button> </td>
                    <td> <button key="e">E</button> </td>
                </tr>
                <tr>
                    <td> <button key="a">A</button> </td>
                    <td> <button key="0">0</button> </td>
                    <td> <button key="b">B</button> </td>
                    <td> <button key="f">F</button> </td>
                </tr>
            </table>
        </div>

    </div>

    <button id="reset" onclick="window.location.reload()">Reset</button>
    <button id="loadrom" onclick="loadRom('examples/chip8-roms-master/games/Brick (Brix hack, 1990).ch8', main)">Load
        ROM</button>


    <div id="debug-items-container">
        <div id="pointers-window" class="window">
            <table id="pointers-table" class="hex-edit hex-table"></table>
        </div>
    
        <div id="timers-window" class="window">
            <table id="timers-table" class="hex-edit hex-table"></table>
        </div>
        <div id="registers-window" class="window">
            <table id="registers-table" class="hex-edit hex-table"></table>
        </div>
        <div id="stack-window" class="window">
            <table id="stack-table" class="hex-edit hex-table"></table>
        </div>
    
        <div id="memory-window" class="window">
            <table id="memory-table" class="hex-edit hex-table"></table>
        </div>
    </div>

    <div id="debug-console"></div>

    <div id="load-rom-window">
        <div class="center-text h1">Load ROM</div>
        <div id="rom-list"></div>
    </div>


</body>
<!-- <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"> -->
<script src="./JS/Utils.js"></script>
<script src="./JS/Chip8Input.js"></script>
<script src="./JS/Chip8Screen.js"></script>
<script src="./JS/Chip8Speaker.js"></script>
<script src="./JS/Chip8Array.js"></script>
<script src="./JS/Chip8CPU.js"></script>
<script src="chip8.js"></script>

<noscript>
    <div class="card center center-text text-size-10 shadow bg-light">
        Sorry, your browser does not support JavaScript!
    </div>
</noscript>

</html>
